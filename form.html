<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <form action="/sumbit" method="post">
        <fieldset>
            <legend><h3>Contact Us Today!</h3></legend>
            <center>
            <table cellpadding="8">
                <tr>
                    <td>
                        <label for="First Name">First Name</label>
                    </td>
                    <td>
                        <input type="text" placeholder="First Name">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="last Name" >Last Name</label>
                    </td>
                    <td>
                        <input type="text" placeholder="Last Name">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="Email"></label>
                    </td>
                    <td>
                        <input type="email" placeholder="E-mail Address">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="phone">Phone#</label>
                    </td>
                    <td>
                        <input type="tel" placeholder="(91)12345-56789">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="addresss">Address</label>
                    </td>
                    <td>
                        <textarea  cols="22" rows="2" placeholder="Address"></textarea>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="city">City</label>
                    </td>
                    <td>
                        <input type="text" placeholder="City">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="state">state</label>
                    </td>
                    <td>
                        <select>
                            <option value="tn">TamilNadu</option>
                            <option value="Kl">kerala</option>
                            <option value="dl">Delhi</option>
                            <option value="go">Goa</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="Zip">Zip Code</label>
                    </td>
                    <td>
                        <input type="url" placeholder="Zip Code">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="website">Website or domain Name</label>
                    </td>
                    <td>
                        <input type="url" placeholder="Website or Domain Name">
                    </td>
                </tr>

                <tr>
                    <tr>
                        <td>
                            <label for="host">Do You Have Hosting?</label>
                        </td>
                        <td>
                            <input type="radio" name="host">Yes <br>
                            <input type="radio"name="host">No
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="project">Project description</label>
                        </td>
                        <td>
                            <textarea cols="22" rows="4" placeholder="Project Description"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td><input type="button" value="Send"></td>
                    </tr>
                </tr>

            </table>
            </center>
        </fieldset>
    </form>
    
</body>
</html>
